services:
  neo4j:
    image: neo4j:5.11
    container_name: knowledge-garden-neo4j
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: neo4j/knowledge-garden
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    container_name: knowledge-garden-api
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    volumes:
      - ./config.yaml:/app/config.yaml:ro

volumes:
  neo4j_data:
