neo4j:
  uri: bolt://localhost:7687
  user: neo4j
  password: knowledge-garden
  database: neo4j

# together_ai.api_key is loaded from TOGETHER_API_KEY env var
together_ai:
  base_url: https://api.together.xyz/v1

embedding:
  provider: huggingface
  model: intfloat/multilingual-e5-large-instruct
  dimension: 1024
  batch_size: 16

llm:
  provider: together
  model: THUDM/glm-4-9b-chat
  max_tokens: 1024
  temperature: 0.3

chunking:
  max_chunk_size: 512
  min_chunk_size: 20

linking:
  threshold: 0.9
  max_neighbors: 10

dedup:
  threshold: 0.95

export:
  output_dir: ./output

search:
  search_limit: 10
