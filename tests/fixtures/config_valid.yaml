vaults:
  - name: personal
    path: /home/user/vaults/personal
  - name: work
    path: /home/user/vaults/work

neo4j:
  uri: bolt://localhost:7687
  user: neo4j
  password: knowledge-garden
  database: neo4j

together_ai:
  api_key: test-api-key-valid
  base_url: https://api.together.xyz/v1

embedding:
  provider: together
  model: togethercomputer/m2-bert-80M-8k-retrieval
  dimension: 768
  batch_size: 64

llm:
  provider: together
  model: THUDM/glm-4-9b-chat
  max_tokens: 1024
  temperature: 0.3

chunking:
  max_chunk_size: 1000
  min_chunk_size: 100

linking:
  threshold: 0.7
  max_neighbors: 20

export:
  output_dir: ./output
