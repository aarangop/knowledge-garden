[project]
name = "knowledge-garden"
version = "0.1.0"
description = "Consolidate multiple Obsidian vaults into a semantically-linked knowledge base"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "neo4j>=5.25.0",
    "httpx>=0.28.0",
    "pydantic==2.13.3",
    "pydantic-settings>=2.7.0,<=2.7.1",
    "pyyaml>=6.0.0",
    "markdown-it-py>=3.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "together>=2.10.0",
    "huggingface_hub[inference]>=1.0.0",
    "numpy>=2.0.0",
    "mcp[cli]>=1.0.0",
]

[project.scripts]
kg = "knowledge_garden.cli:app"
kg-mcp = "knowledge_garden.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires Neo4j, Together AI)",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
    "types-pyyaml>=6.0.12.20260408",
]
